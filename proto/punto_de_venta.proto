syntax = "proto3";

// V1 es de test
package puntodeventa.v1;

// Opciones para generar el cliente Android con Java/Kotlin.
option java_multiple_files = true;
option java_package = "com.alffy.puntodeventa.grpc";
option java_outer_classname = "ConexionProto";

service ConexionService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string cliente = 1;
}

message PingResponse {
  bool conectado = 1;
  string mensaje = 2;
}

service ProductService {
    rpc CreateProduct(CreateProductRequest)
        returns (CreateProductResponse);
}

message ProductImage {
    bytes data = 1;
}

message CreateProductRequest {
    string nombre = 1;
    int32 precio = 3;
    int32 costo = 4;
    string descripcion = 5;
    ProductImage imagen = 6;
}

message CreateProductResponse {
    bool ok = 1;
    string mensaje = 2;
    int64 product_id = 3;
    string internal_barcode = 4;
}
