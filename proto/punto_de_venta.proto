syntax = "proto3";

package puntodeventa.v1;

option java_multiple_files = true;
option java_package = "com.alffy.puntodeventa.grpc";
option java_outer_classname = "ConexionProto";

service SaleService {

    rpc CreateSale(CreateSaleRequest)
        returns (CreateSaleResponse);
}


enum PaymentMethod {
    PAYMENT_METHOD_UNSPECIFIED = 0;
    PAYMENT_METHOD_DEBIT = 1;
    PAYMENT_METHOD_CREDIT = 2;
}


message SaleItemRequest {
    string barcode = 1;
    int32 cantidad = 2;

    // Precio establecido al momento de realizar la venta.
    int32 precio_unitario = 3;
}


message CreateSaleRequest {

    repeated SaleItemRequest items = 1;

    // Identificador generado por el cliente para esta
    // operación de venta.
    //
    // Si la misma venta se reintenta, debe reutilizarse
    // exactamente el mismo request_id.
    string request_id = 2;

    PaymentMethod payment_method = 3;
}


message SaleItem {
    int64 product_id = 1;
    string barcode = 2;
    string nombre = 3;
    int32 cantidad = 4;
    int32 precio_unitario = 5;
    int64 subtotal = 6;
}


message CreateSaleResponse {
    bool ok = 1;
    int64 sale_id = 2;
    int64 total = 3;
    repeated SaleItem items = 4;

    PaymentMethod payment_method = 5;

    // Útil para que el cliente pueda relacionar
    // la respuesta con la operación original.
    string request_id = 6;
}

/////////////////////////////////////////////////////////////

service ProductService {

    rpc CreateProduct(CreateProductRequest)
        returns (CreateProductResponse);

    rpc GetProductById(GetProductByIdRequest)
        returns (GetProductResponse);

    rpc GetProductByBarcode(GetProductByBarcodeRequest)
        returns (GetProductResponse);

    rpc UpdateProduct(UpdateProductRequest)
        returns (UpdateProductResponse);

    rpc DeleteProduct(DeleteProductRequest)
        returns (DeleteProductResponse);

    rpc ListProducts(ListProductsRequest)
      returns (ListProductsResponse);

    rpc SearchProducts(SearchProductsRequest)
      returns (SearchProductsResponse);

}


//////////////////////
// Models
//////////////////////

message SearchProductsRequest {
    string query = 1;

    // Cantidad REAL de productos que quiere el cliente.
    // El backend internamente puede pedir page_size + 1.
    int32 page_size = 2;

    // Vacío = primera página.
    // El cliente no debe interpretar este valor.
    string page_token = 3;
}


message SearchProductsResponse {
    repeated ProductoResumen productos = 1;

    // Vacío significa que no existe otra página.
    string next_page_token = 2;
}

message ProductoResumen {
  int64 product_id = 1;
  string nombre = 2;
  string barcode = 3;
  int32 precio = 4;
  int32 cantidad = 6;

  // Imagen reducida para la tarjeta.
  // Puede omitirse si todavía no hay miniatura.
  ProductImage miniatura = 5;
}

message ListProductsRequest {
  // Cantidad máxima solicitada.
  // Reglas que implementaremos en el servidor:
  // 0: usar 20.
  // Negativo: INVALID_ARGUMENT.
  // Mayor a 100: usar 100.
  int32 page_size = 1;

  // Vacío para la primera página.
  // Después, enviar el next_page_token recibido.
  string page_token = 2;
}

message ListProductsResponse {
  repeated ProductoResumen productos = 1;

  // Vacío cuando no quedan más páginas.
  string next_page_token = 2;
}

message ProductImage {
  bytes data = 1;
}

message Producto {
  int64 product_id = 1;
  string nombre = 2;
  string barcode = 3;
  string descripcion = 4;
  int32 precio = 5;
  int32 costo = 6;
  ProductImage imagen = 7;
  int32 cantidad = 8;
}


//////////////////////
// Requests
//////////////////////

message GetProductByIdRequest {
  int64 product_id = 1;
}

message GetProductByBarcodeRequest {
  string barcode = 1;
}

message CreateProductRequest {
  string nombre = 1;
  int32 precio = 2;
  int32 costo = 3;
  string descripcion = 4;
  ProductImage imagen = 5;
  int32 cantidad = 6;
}

message UpdateProductRequest {
  Producto producto = 1;
}

message DeleteProductRequest {
  string barcode = 1;
}

//////////////////////
// Responses
//////////////////////

message GetProductResponse {
  Producto producto = 1;
}

message UpdateProductResponse {
  bool ok = 1;
}

message DeleteProductResponse {
  bool ok = 1;
}

message CreateProductResponse {
  bool ok = 1;
  string mensaje = 2;
  int64 product_id = 3;
  string internal_barcode = 4;
}
